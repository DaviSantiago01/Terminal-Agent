services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: terminal_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terminal_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/terminal_agent
      RUN_MIGRATIONS_ON_STARTUP: "false"
    command: ["python", "-m", "apps.backend.migrations.run"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/terminal_agent
      RUN_MIGRATIONS_ON_STARTUP: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    command: ["python", "-m", "uvicorn", "apps.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: runner
      args:
        INTERNAL_API_URL: http://api:8000
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: /api
    command: ["npm", "run", "start", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
