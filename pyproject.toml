[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-agent"
version = "0.1.0"
description = "Terminal-first AI assistant with task tools and persistent history"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "langchain>=0.3.0",
  "typer>=0.12.5",
  "rich>=13.7.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.1",
  "langgraph>=0.2.34",
  "langchain-groq>=0.2.0",
  "uvicorn>=0.35.0"
]

[project.scripts]
terminal-agent = "core.cli:cli"
agent-cli = "core.cli:cli"
terminal-agent-backend = "apps.backend.main:run"
terminal-agent-api = "apps.backend.main:run"

[tool.setuptools.packages.find]
include = ["core", "core.*", "apps", "apps.*"]
